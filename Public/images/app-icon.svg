<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3C9"/>
      <stop offset=".42" stop-color="#F6CE6D"/>
      <stop offset=".72" stop-color="#D99A31"/>
      <stop offset="1" stop-color="#A96C17"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#8E1220"/>
      <stop offset=".55" stop-color="#5A0910"/>
      <stop offset="1" stop-color="#260306"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F2E4C9"/>
    </linearGradient>
    <linearGradient id="coin" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFF6D0"/>
      <stop offset=".45" stop-color="#F3C45E"/>
      <stop offset="1" stop-color="#B9791C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".35" r=".6">
      <stop offset="0" stop-color="#FFE1A0" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FFE1A0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#gold)"/>
  <rect x="15" y="15" width="482" height="482" rx="101" fill="url(#ruby)"/>
  <rect x="15" y="15" width="482" height="482" rx="101" fill="url(#glow)"/>
  <rect x="27" y="27" width="458" height="458" rx="90" fill="none" stroke="#F3C45E" stroke-opacity=".38" stroke-width="2"/>

  <!-- sparkles -->
  <g fill="#FFE9AE" opacity=".9">
    <path d="M92 118l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".55"/>
    <path d="M424 150l4.5 12 12 4.5-12 4.5-4.5 12-4.5-12-12-4.5 12-4.5z" opacity=".45"/>
  </g>

  <!-- fanned cards -->
  <g transform="translate(256 210)" filter="url(#soft)">
    <!-- back card -->
    <g transform="rotate(-24) translate(-8 -4)">
      <rect x="-58" y="-82" width="116" height="164" rx="12" fill="#3C0710" stroke="#E4B45A" stroke-width="4"/>
      <rect x="-45" y="-69" width="90" height="138" rx="7" fill="none" stroke="#F3C45E" stroke-opacity=".5" stroke-width="2"/>
      <g fill="#F3C45E" opacity=".65">
        <path d="M0-26c8 8 18 14 18 24a9 9 0 0 1-14 7c1 5 3.5 8.5 6.5 11.5h-21C-7.5 13.5-5 10-4 5a9 9 0 0 1-14-7c0-10 10-16 18-24z"/>
      </g>
    </g>
    <!-- right card -->
    <g transform="rotate(19) translate(34 6)">
      <rect x="-56" y="-80" width="112" height="160" rx="11" fill="url(#card)" stroke="#E9D4AB" stroke-width="2"/>
      <text x="-42" y="-46" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#C0182B">A</text>
      <path d="M-30-40l12 16-12 16-12-16z" fill="#C0182B"/>
      <path d="M0 0c-9 0-16-7-16-16 0-12 16-24 16-24s16 12 16 24C16-7 9 0 0 0z" fill="#C0182B"/>
      <text x="26" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#C0182B" text-anchor="end">A</text>
    </g>
    <!-- left card -->
    <g transform="rotate(-17) translate(-40 8)">
      <rect x="-56" y="-80" width="112" height="160" rx="11" fill="url(#card)" stroke="#E9D4AB" stroke-width="2"/>
      <text x="-42" y="-46" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#17110C">A</text>
      <path d="M-18-40c4 5 10 9 10 15a6 6 0 0 1-9 4.5c.5 3.5 2 6 4 8h-13c2-2 3.5-4.5 4-8a6 6 0 0 1-3 1 6 6 0 0 1-3-10.5c0-6 6-10 10-15z" fill="#17110C" transform="translate(0 -2)"/>
      <text x="24" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#17110C" text-anchor="end">A</text>
    </g>
    <!-- front card -->
    <g transform="translate(0 6)">
      <rect x="-60" y="-86" width="120" height="172" rx="12" fill="url(#card)" stroke="#E9D4AB" stroke-width="2"/>
      <rect x="-50" y="-76" width="100" height="152" rx="7" fill="none" stroke="#C9A96A" stroke-opacity=".45" stroke-width="1.5"/>
      <text x="-45" y="-50" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#C0182B">A</text>
      <path d="M-31-15c11 0 20 9 20 20 0 14-20 30-20 30S-51 19-51 5c0-11 9-20 20-20z" fill="#C0182B" transform="translate(0 -8) scale(1.05)"/>
      <text x="45" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#C0182B" text-anchor="end">A</text>
    </g>
  </g>

  <!-- gold coins -->
  <g filter="url(#soft)">
    <g transform="translate(112 372)">
      <circle r="46" fill="url(#coin)"/>
      <circle r="35" fill="none" stroke="#8A5A12" stroke-opacity=".55" stroke-width="3"/>
      <path d="M0-22l7 15 16 2-12 11 3 16L0 15l-14 7 3-16-12-11 16-2z" fill="#8A5A12" opacity=".75"/>
    </g>
    <g transform="translate(402 356)">
      <circle r="38" fill="url(#coin)"/>
      <circle r="28" fill="none" stroke="#8A5A12" stroke-opacity=".55" stroke-width="3"/>
      <path d="M0-18l6 12 13 2-10 9 3 13L0 12l-12 6 3-13-10-9 13-2z" fill="#8A5A12" opacity=".75"/>
    </g>
    <g transform="translate(62 300)">
      <circle r="24" fill="url(#coin)" opacity=".9"/>
      <circle r="17" fill="none" stroke="#8A5A12" stroke-opacity=".5" stroke-width="2.5"/>
    </g>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900">
    <text x="256" y="452" font-size="52" letter-spacing="1" fill="#FFE9AE" stroke="#8A5A12" stroke-width="5" paint-order="stroke" stroke-linejoin="round">3PATTI</text>
    <text x="256" y="490" font-size="30" letter-spacing="10" fill="#FFC94D">HOT</text>
  </g>
</svg>
